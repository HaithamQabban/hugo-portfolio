title = 'Haitham Qabban'
disableKinds = ['taxonomy', 'term']

[build]
  [build.buildStats]
    enable = true

[[build.cachebusters]]
  source = 'assets/notwatching/hugo_stats\.json'
  target = 'css'

[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^node$', '^npx$', '^postcss$', '^tailwindcss$']

[module]

  [[module.imports]]
    path = "github.com/hugo-themes/nerdy"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"